name: Quarterly auto-audit
on:
  schedule:
    # 00:00 UTC on the 1st of every 3rd month - Jan / Apr / Jul / Oct
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch: {} # allow manual triggering

permissions:
  contents: write
  pull-requests: write

# Force pinned actions onto Node 24 so we don't trip the v4 (Node 20)
# deprecation warning on quarterly runs. Removable once every action is
# explicitly bumped to a v5+ release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-quarterly-audit.mjs
      - name: Open PR with audit findings
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/quarterly-audit-${{ github.run_id }}
          base: main
          title: 'Quarterly auto-audit - please triage'
          body: |
            Auto-generated audit. Review the markdown file in `docs/superpowers/audits/`
            and either:
            - Open follow-up issues for actionable findings, then merge this PR, OR
            - Close this PR if everything is noise

            Generated by `.github/workflows/quarterly-audit.yml`.
          add-paths: docs/superpowers/audits/
          commit-message: 'chore: quarterly auto-audit findings'
