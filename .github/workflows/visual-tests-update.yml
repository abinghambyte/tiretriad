# On-demand baseline regeneration for the visual snapshot suite.
#
# Run this workflow manually (Actions tab -> "Visual tests - update Linux
# baselines" -> Run workflow) after an intentional UI change. It regenerates
# the `*-linux.png` snapshots on Linux and opens a PR with the diff so that
# admins on Windows or macOS can refresh the platform-specific baselines
# without leaving their host OS.

name: Visual tests - update Linux baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to regenerate baselines from (defaults to main)'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write

# Force pinned actions onto Node 24 to silence the v4 (Node 20)
# deprecation warning. Removable once every action is bumped to v5+.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  regen:
    name: Regenerate Linux snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Update visual snapshots
        run: npm run test:visual:update

      - name: Open PR with regenerated baselines
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'Regenerate Linux visual baselines'
          title: 'Regenerate Linux visual baselines'
          body: |
            Regenerated by the `visual-tests-update` workflow.

            Triggered from branch `${{ inputs.branch }}` by @${{ github.actor }}.

            Review the snapshot diffs carefully before merging - any unexpected
            change here means a real visual regression slipped in.
          branch: chore/regen-visual-baselines
          delete-branch: true
          add-paths: |
            tests/visual/**/*-linux.png
