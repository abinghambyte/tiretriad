      description: Admin — set credit card limit on meta doc
      should_escape: false
    - command: setquota
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Admin — set weekly/monthly quota targets
      should_escape: false
    - command: stock
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Tire stock / catalog line for MSPN
      should_escape: false
    - command: weather
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Quick weather line for ops
      should_escape: false
    # Price intelligence (priceIntelSlack.js)
    - command: confirmpricing
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Confirm Kyle price for price intel (freeze active buy)
      should_escape: false
    - command: flaggedprices
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: List tires flagged for price review
      should_escape: false
    - command: pricehistory
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Price intel source history for an MSPN
      should_escape: false
    - command: refreshprice
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Gemini price research (modal MSPN, or text "all" for bulk catalog)
      should_escape: false
    - command: unconfirmpricing
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
