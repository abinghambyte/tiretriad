# Rubber Signal — Slack app manifest (generated from functions/index.js + *Slack*.js routers)
# All slash commands POST to the same Cloud Function URL as Slack interactivity.
# Request URL pattern: POST https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
#   Body: application/x-www-form-urlencoded (slash) or payload=... (interactivity)

_metadata:
  major_version: 2
  minor_version: 0

display_information:
  name: Rubber Signal
  description: Skedaddle fleet ops — finance, inventory, schedule, field, CRM, price intel, credit
  background_color: "#0f172a"

features:
  bot_user:
    display_name: Rubber Signal
    always_online: true
  slash_commands:
    # Credit (creditTrackerSlack.js)
    - command: balance
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Post credit card balance snapshot to fleet channel
      should_escape: false
    - command: charge
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Start a card charge draft (Block Kit confirm)
      should_escape: false
    - command: payment
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Record a payment against the credit tracker
      should_escape: false
    # Rubber CRM (crmSlackCommands.js)
    - command: crm
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: CRM account lookup and actions
      should_escape: false
    - command: log
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Log CRM activity on an account
      should_escape: false
    - command: pipeline
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: CRM pipeline summary
      should_escape: false
    # Field (fieldSlackCommands.js)
    - command: confirm
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Confirm order / availability from Slack
      should_escape: false
    - command: done
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Mark field work done and refresh order Slack
      should_escape: false
    - command: myorders
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: List my assigned active orders
      should_escape: false
    - command: onmyway
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Mark in transit / on the way
      should_escape: false
    - command: sms
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: SMS helper for customer contact
      should_escape: false
    # Finance (financeSlackCommands.js)
    - command: owed
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Crew balances owed
      should_escape: false
    - command: payout
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Record or view payouts
      should_escape: false
    - command: revenue
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Revenue stats digest
      should_escape: false
    - command: spoils
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Crew spoils / pool summary
      should_escape: false
    # Inventory (inventorySlackCommands.js)
    - command: bestsellers
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Top sellers by completed orders
      should_escape: false
    - command: dead
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Dead stock flagged tires
      should_escape: false
    - command: forecast
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Weeks of stock forecast for an MSPN
      should_escape: false
    - command: intake
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Tire intake flow
      should_escape: false
    - command: lowstock
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Low stock tires
      should_escape: false
    - command: reorder
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Reorder queue for Kyle
      should_escape: false
    - command: slowmovers
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Slow-moving inventory
      should_escape: false
    - command: velocity
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Velocity intel for a tire or list
      should_escape: false
    # Lookup & utilities (lookupUtilitySlackCommands.js)
    - command: customer
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Customer / contact lookup
      should_escape: false
    - command: dispatch
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Post dispatch context for an order to fleet
      should_escape: false
    - command: hype
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: One-line crew hype (Anthropic)
      should_escape: false
    - command: margins
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
