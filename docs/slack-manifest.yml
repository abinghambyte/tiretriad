      should_escape: false
    - command: delivery
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Schedule a delivery window
      should_escape: false
    - command: myavailability
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Show my blocked slots
      should_escape: false
    - command: openslots
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Open scheduling slots
      should_escape: false
    - command: pickup
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Schedule a pickup window
      should_escape: false
    - command: reschedule
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Reschedule an order
      should_escape: false
    - command: schedule
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Schedule helper
      should_escape: false
    - command: tomorrow
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Tomorrow schedule digest
      should_escape: false
    - command: unblock
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Remove a blocked availability window
      should_escape: false
    - command: unscheduled
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Orders needing a schedule
      should_escape: false
    - command: week
      url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions
      description: Week view for schedule
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - commands

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  interactivity:
    is_enabled: true
    request_url: https://us-central1-skedaddle-inventory.cloudfunctions.net/slackActions

# =============================================================================
# SCAN NOTES (index.js + slash routers — 2026-04-15)
# =============================================================================
# Exported onRequest handlers that parse Slack slash commands:
#   - slackActions — reads application/x-www-form-urlencoded body; if `payload`
#     is absent but `command` is present, builds `form` from entries and calls
#     handleCreditSlashCommand (functions/creditTrackerSlack.js), which chains
#     tryHandleFinanceSlash, tryHandleLookupUtilitySlash, tryHandleScheduleSlash,
#     tryHandleFieldSlash, tryHandleInventorySlash, tryHandleCrmSlash,
#     tryHandlePriceIntelSlash, then /charge /payment /balance.
#   - inboundSms — Sinch MO webhook; NOT a slash command.
#   - ebayOrderWebhook — eBay notifications; NOT a slash command.
#
# No slack-manifest.yml, slack-manifest.json, or other .yml/.yaml Slack manifest
# existed in repo root or docs/ before this file.
#
# -----------------------------------------------------------------------------
# "Stubs" / wiring gaps (commands in code with no separate deploy OR not implemented)
# -----------------------------------------------------------------------------
# - No unimplemented slash-command stubs were found: every command string routed
#   in the modules above has a concrete handler (no TODO/placeholder return paths
#   for slash dispatch).
# - Architecture: ALL slash commands share ONE HTTPS function (`slackActions`).
#   There are NO per-command Cloud Function names for slash in this codebase.
#   Slack must be configured so every command’s Request URL is that single URL.
# - Optional runtime deps (handlers exist; may return ephemeral errors if unset):
#   GEMINI_API_KEY — /refreshprice (incl. "all" bulk) and price-intel flows; ANTHROPIC_API_KEY — /hype;
#   SLACK_ADMIN_USER_IDS — /setlimit, /setquota; meta/creditTracker — /charge,
#   /payment, /balance; credit tracker + channel for /balance fleet post.
# - docs/AI-CONTEXT.md “Slack slash commands” list omits CRM (/crm, /log, /pipeline)
#   and price intel (/flaggedprices, /refreshprice, /pricehistory, /confirmpricing,
#   /unconfirmpricing); they are implemented and included in this manifest.
# =============================================================================
