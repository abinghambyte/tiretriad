<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://www.skedaddleinc.com/" />

    <!-- Title + description.
         Authenticated portal: not Googlebot-indexable, but title + description
         drive share-link previews and browser tab readability. -->
    <title>Skedaddle Portal — Tire resale ops, CRM, analytics</title>
    <meta
      name="description"
      content="Private operations portal for Skedaddle Inc. Tire catalog, customer CRM, payouts, listing generator, and Slack-integrated field crew workflows."
    />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph (Slack / Discord / iMessage previews when sharing deep links). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skedaddle Portal" />
    <meta property="og:title" content="Skedaddle Portal" />
    <meta
      property="og:description"
      content="Private operations portal for Skedaddle Inc. Tire catalog, CRM, analytics, listings."
    />
    <meta property="og:url" content="https://www.skedaddleinc.com/" />

    <!-- Twitter card. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Skedaddle Portal" />
    <meta
      name="twitter:description"
      content="Private operations portal for Skedaddle Inc."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
